<?xml version="1.0" encoding="UTF-8"?>
<!--
  JANOON tab mark — the gold "J" crest on nothing at all.

  `public/logo.svg` is the full emblem: ornate gold linework painted on a
  near-black forest tile. That tile is right for the header and for the
  home-screen icons, but it is exactly wrong for a browser tab. A tab asks for
  16px, the tile fills every one of them with near-black, and the hairline gold
  work is gone by the time it is scaled down — the tab shows a dark block with
  nothing legible in it. (Measured on the old icon: zero gold pixels at 16px.)

  So the tab gets its own artwork: the same gold, drawn plain and bold enough to
  survive being 16 pixels wide, on a fully transparent background so the
  browser's own tab colour shows through.

  Nothing here is text. Every stroke is a path, so the mark rasterises the same
  on any machine, whatever fonts that machine happens to have.

  The gold is a shade deeper than the site's headline gold on purpose. Pure
  bright gold sits at roughly 2:1 against a white tab bar and washes out; this
  range clears 3:1 against white and 4:1 against a dark tab bar, so one file
  reads on both without a plate behind it.

  Regenerate the raster sizes with `bun tools/generate-favicons.mjs`, then bump
  the `?v=` suffix on the icon links in `index.html` and
  `public/manifest.webmanifest` so browsers stop serving the cached old icon.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 64 64"
  role="img"
  aria-label="Janoon"
>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c79526" />
      <stop offset="1" stop-color="#a0710f" />
    </linearGradient>
  </defs>

  <!-- Crest ring. -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#gold)" stroke-width="6" />

  <!-- Serif monogram: stem falling from the top into a hook. -->
  <path
    d="M41 18.5 V34 A9.75 9.75 0 0 1 21.5 34"
    fill="none"
    stroke="url(#gold)"
    stroke-width="10.5"
    stroke-linecap="round"
  />
</svg>
