<?xml version="1.0" encoding="UTF-8"?>
<!--
  Janoon browser icon / monogram.

  A single gold "J" on a warm near-black tile: no text, no illustration, and it
  stays legible down to 16px. The gold is the same accent the site uses for its
  buttons and rules, and the tile is the same warm charcoal as the page
  background, so the tab matches the restaurant.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Janoon">
  <defs>
    <linearGradient id="jan-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2016" />
      <stop offset="1" stop-color="#120e0a" />
    </linearGradient>
    <linearGradient id="jan-gold" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f0cd72" />
      <stop offset="0.5" stop-color="#e3b341" />
      <stop offset="1" stop-color="#c9822f" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#jan-bg)" />

  <path
    d="M362 114 V292 A106 106 0 0 1 150 292 V228"
    fill="none"
    stroke="url(#jan-gold)"
    stroke-width="62"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
