<?xml version="1.0" encoding="UTF-8"?>
<!--
  JUNOON emblem — the house crest, drawn from the uploaded logo.

  A gold shield in the Mughal leaf shape: a solid point at the foot, an inner
  dotted outline, and a leaf standing in the middle of it. Gold on nothing —
  the tile behind it is whatever the page is, which is what the header, both
  portals, the auth cards and the 404 all want.

  The wordmark is NOT in this file. "JUNOON", "IMPERIAL DINING & HIGH TEA" and
  the Urdu line are real text in the header and footer where they can be
  translated, read by a screen reader and kept crisp at any size.

  The apple-touch icon and the PWA manifest icons are cut from this crest and
  flattened onto the house's dark tile by `tools/generate-favicons.mjs`, because
  iOS and Android mask those corners themselves. The browser tab is drawn from
  `public/favicon.svg` instead: this crest's dotted ring and leaf turn to mush
  at 16px.

  Regenerate the rasters after any change here:

      bun tools/generate-favicons.mjs
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 64 64"
  role="img"
  aria-label="Junoon"
  shape-rendering="geometricPrecision"
>
  <defs>
    <linearGradient id="gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f2d47f" />
      <stop offset="0.5" stop-color="#d4a843" />
      <stop offset="1" stop-color="#b8892c" />
    </linearGradient>
  </defs>

  <!-- Shield outline -->
  <path
    d="M32 4 C39 9 50 13 54.5 23 C58 33 53.5 46 32 60 C10.5 46 6 33 9.5 23 C14 13 25 9 32 4 Z"
    fill="none"
    stroke="url(#gold)"
    stroke-width="2.4"
    stroke-linejoin="round"
  />

  <!-- Inner dotted outline, the same shield drawn inside itself -->
  <path
    d="M32 4 C39 9 50 13 54.5 23 C58 33 53.5 46 32 60 C10.5 46 6 33 9.5 23 C14 13 25 9 32 4 Z"
    fill="none"
    stroke="url(#gold)"
    stroke-width="0.9"
    stroke-dasharray="1.5 2.4"
    opacity="0.9"
    transform="translate(32 32) scale(0.84) translate(-32 -32)"
  />

  <!-- The leaf -->
  <path
    d="M32 16 C38.5 24 38.5 35 32 44.5 C25.5 35 25.5 24 32 16 Z"
    fill="url(#gold)"
  />

  <!-- Finial -->
  <path d="M32 1.4 L33.8 3.8 L32 6.2 L30.2 3.8 Z" fill="url(#gold)" />
</svg>
