<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- JUNOON brand marks, both rasterised by `tools/generate-favicons.mjs`.

       The tab icons come from `public/favicon.svg` — the gold ring and monogram
       drawn on transparency, so the tab keeps its own colour and the gold reads
       on light and dark chrome alike. The full emblem in `public/logo.svg`
       paints a near-black tile, which at 16px is just a dark block, so it is
       kept for the sizes where a solid tile is wanted: the iOS home-screen icon
       and the manifest icons, both of which the OS masks itself.

       The `?v=` suffix is deliberate. Browsers cache favicons by URL and will
       keep showing an old one for a long time, so every icon path is versioned:
       bump it whenever a mark changes and the tab refreshes by itself.

       The ICO and PNGs come first so every browser has a raster it can draw,
       with the SVG offered after them for the ones that scale it crisply. -->
  <link rel="icon" href="/favicon.ico?v=6" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=6" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=6" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=6" />
  <link rel="manifest" href="/manifest.webmanifest?v=6" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1a10" />
  <meta
    name="description"
    content="Junoon — Pakistani restaurant in Gulberg, Lahore. Mughal haute cuisine, live coal counters, High Tea and dastarkhwan, open all day."
  />
  <meta name="application-name" content="Junoon" />
  <meta name="apple-mobile-web-app-title" content="Junoon" />
  <meta property="og:site_name" content="Junoon" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Junoon — Pakistani Restaurant in Gulberg, Lahore" />
  <meta
    property="og:description"
    content="Open-air, all-you-can-eat Pakistani BBQ, handi and desi desserts in Gulberg, Lahore."
  />
  <meta property="og:image" content="/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <title>Junoon — Pakistani Restaurant in Gulberg, Lahore</title>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
