<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Janoon browser icon — a single gold "J" on the warm charcoal tile.

       The `?v=` suffix is deliberate. Browsers cache favicons by URL and will
       keep showing an old one for a long time, so every icon path is versioned:
       bump it whenever the mark changes and the tab refreshes by itself.

       The ICO and PNGs come first so every browser has a raster it can draw,
       with the SVG offered after them for the ones that scale it crisply. The
       apple-touch icon is the same mark on an opaque, full-bleed tile. -->
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
  <link rel="manifest" href="/manifest.webmanifest?v=2" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1c1712" />
  <meta
    name="description"
    content="Janoon — 24/7 all-you-can-eat buffet in Gulberg, Lahore. Live-fire Pakistani BBQ, traditional handi, fast bites and desi desserts. Book your table ahead."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <title>Janoon Buffet Web</title>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
