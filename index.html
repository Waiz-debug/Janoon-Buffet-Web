<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- JUNOON brand emblem — the ornate gold-on-green logo.

       The `?v=` suffix is deliberate. Browsers cache favicons by URL and will
       keep showing an old one for a long time, so every icon path is versioned:
       bump it whenever the mark changes and the tab refreshes by itself.

       The ICO and PNGs come first so every browser has a raster it can draw,
       with the SVG offered after them for the ones that scale it crisply. The
       apple-touch icon is the same mark on an opaque, full-bleed tile. -->
  <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
  <link rel="manifest" href="/manifest.webmanifest?v=3" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1a10" />
  <meta
    name="description"
    content="JUNOON — 24/7 all-you-can-eat Pakistani restaurant in Gulberg, Lahore. Live-fire BBQ, traditional handi, fast bites and desi desserts. Book your table ahead."
  />
  <meta name="application-name" content="JUNOON" />
  <meta name="apple-mobile-web-app-title" content="JUNOON" />
  <meta property="og:site_name" content="JUNOON" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="JUNOON — Pakistani Restaurant in Lahore" />
  <meta
    property="og:description"
    content="Open-air, all-you-can-eat Pakistani BBQ, handi and desi desserts in Gulberg, Lahore. Open 24 hours, every day."
  />
  <meta property="og:image" content="/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <title>JUNOON — Pakistani Restaurant in Gulberg, Lahore</title>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
